<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/icon-192x192.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#ffffff" />

    <title>ZTracker Front</title>
  </head>
  <body>
    <div id="root">
      <!-- Inline splash screen: hiển thị ngay trước khi React load -->
      <div id="splash" style="display:flex;align-items:center;justify-content:center;height:100dvh;background:#f5f5f4;flex-direction:column;gap:16px;">
        <img src="/icon-192x192.svg" width="64" height="64" alt="ZTracker" />
        <div style="display:flex;align-items:center;gap:8px;">
          <div style="width:20px;height:20px;border:3px solid #d6d3d1;border-top-color:#10b981;border-radius:50%;animation:splash-spin .6s linear infinite;"></div>
          <span style="color:#78716c;font-size:14px;font-family:system-ui,sans-serif;">Đang tải...</span>
        </div>
      </div>
      <style>@keyframes splash-spin{to{transform:rotate(360deg)}}</style>
    </div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
